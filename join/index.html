<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Dear Crayon</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
.join { max-width: 520px; margin: 0 auto; padding: 40px 20px 56px; }
.join h1 { font-size: 26px; line-height: 1.35; margin: 16px 0 12px; }
.join .lead { color: var(--subtle); margin-bottom: 24px; }
.join .btn { display: block; text-align: center; padding: 16px; border-radius: 14px; font-weight: 700; text-decoration: none; margin-top: 12px; border: 0; width: 100%; font-size: 17px; cursor: pointer; }
.join .primary { background: #BA3620; color: #fff; }
.join .soft { background: var(--soft); color: inherit; border: 1px solid var(--line); }
.join ol { margin: 28px 0 0; padding-left: 20px; color: var(--subtle); }
.join .warn { background: #FFF4E5; border-radius: 12px; padding: 12px 14px; margin-top: 16px; }
.join .note { font-size: 14px; color: var(--subtle); margin-top: 20px; }
</style>
</head>
<body>
<main class="join">
<img src="../assets/logo.png" alt="Dear Crayon" width="96" onerror="this.remove()">
<h1 id="t"></h1>
<p class="lead" id="lead"></p>
<div id="bad" class="warn" hidden></div>
<div id="ios" class="warn" hidden></div>
<a id="open" class="btn primary" href="#"></a>
<a id="get" class="btn soft" href="#"></a>
<button id="copy" class="btn soft" type="button"></button>
<ol id="steps"></ol>
<p class="note" id="note"></p>
</main>
<script>
(function () {
  var T = {"ko": {"title": "선생님이 보낸 작품 받기", "lead": "어린이집 · 학원 선생님이 아이의 작품을 Dear Crayon 앱으로 보내 드려요. 처음 한 번만 이으면, 그다음부터는 선생님이 찍은 작품이 앱에 저절로 들어와요.", "open": "Dear Crayon 앱에서 열기", "get": "앱 받기(구글 플레이)", "copy": "링크 복사", "copied": "복사했어요", "steps": ["앱이 없으면 먼저 받아 설치해요.", "설치한 뒤 이 페이지로 돌아와 [Dear Crayon 앱에서 열기]를 눌러요.", "앱이 열리지 않으면 [링크 복사] → 앱의 우리 아이 › 선생님과 연결 › 링크 붙여 넣기."], "bad": "링크가 잘렸어요. 선생님이 보낸 메시지의 링크를 그대로 눌러 주세요.", "ios": "아이폰 앱은 준비 중이에요. 지금은 안드로이드에서만 받을 수 있어요.", "note": "이 링크는 우리 아이 전용이에요. 다른 사람에게 보내지 마세요."}, "en": {"title": "Get artwork from your child’s teacher", "lead": "Your child’s teacher sends their artwork through the Dear Crayon app. Connect once, and the artwork they photograph arrives in the app on its own.", "open": "Open in Dear Crayon", "get": "Get the app (Google Play)", "copy": "Copy link", "copied": "Copied", "steps": ["If you don’t have the app, install it first.", "Then come back to this page and tap “Open in Dear Crayon”.", "If the app doesn’t open, tap “Copy link” → in the app, My Kids › Connect with teachers › Paste link."], "bad": "This link looks cut off. Please tap the link in the teacher’s message as it is.", "ios": "The iPhone app is coming soon. For now it works on Android only.", "note": "This link is only for your child. Please don’t forward it."}, "de": {"title": "Kunstwerke von der Lehrkraft erhalten", "lead": "Die Lehrkraft Ihres Kindes schickt die Kunstwerke über die App Dear Crayon. Einmal verbinden – danach kommen die Fotos von selbst in der App an.", "open": "In Dear Crayon öffnen", "get": "App laden (Google Play)", "copy": "Link kopieren", "copied": "Kopiert", "steps": ["Falls die App fehlt, zuerst installieren.", "Dann zu dieser Seite zurückkehren und „In Dear Crayon öffnen“ tippen.", "Öffnet sich die App nicht: „Link kopieren“ → in der App Meine Kinder › Mit Lehrkräften verbinden › Link einfügen."], "bad": "Der Link scheint abgeschnitten. Bitte tippen Sie den Link in der Nachricht der Lehrkraft unverändert an.", "ios": "Die iPhone-App kommt bald. Derzeit nur für Android.", "note": "Dieser Link gilt nur für Ihr Kind. Bitte nicht weitergeben."}, "fr": {"title": "Recevoir les œuvres de l’enseignant·e", "lead": "L’enseignant·e de votre enfant envoie ses œuvres via l’app Dear Crayon. Reliez-vous une fois : les photos arrivent ensuite toutes seules dans l’app.", "open": "Ouvrir dans Dear Crayon", "get": "Obtenir l’app (Google Play)", "copy": "Copier le lien", "copied": "Copié", "steps": ["Si vous n’avez pas l’app, installez-la d’abord.", "Revenez ensuite sur cette page et touchez « Ouvrir dans Dear Crayon ».", "Si l’app ne s’ouvre pas : « Copier le lien » → dans l’app, Mes enfants › Se relier aux enseignants › Coller le lien."], "bad": "Ce lien semble coupé. Touchez le lien du message de l’enseignant·e tel quel.", "ios": "L’app iPhone arrive bientôt. Pour l’instant, seulement sur Android.", "note": "Ce lien est réservé à votre enfant. Ne le transférez pas."}, "es": {"title": "Recibir las obras del docente", "lead": "El docente de tu hijo envía sus obras con la app Dear Crayon. Conéctate una vez y las fotos llegarán solas a la app.", "open": "Abrir en Dear Crayon", "get": "Obtener la app (Google Play)", "copy": "Copiar enlace", "copied": "Copiado", "steps": ["Si no tienes la app, instálala primero.", "Después vuelve a esta página y toca «Abrir en Dear Crayon».", "Si la app no se abre: «Copiar enlace» → en la app, Mis peques › Conectar con docentes › Pegar enlace."], "bad": "El enlace parece cortado. Toca el enlace del mensaje del docente tal cual.", "ios": "La app para iPhone llegará pronto. Por ahora solo en Android.", "note": "Este enlace es solo para tu hijo. No lo reenvíes."}, "ja": {"title": "先生から作品を受け取る", "lead": "園・教室の先生が、子どもの作品を Dear Crayon アプリで届けます。最初に一度つなぐだけで、その後は先生が撮った作品がアプリに自動で入ります。", "open": "Dear Crayon アプリで開く", "get": "アプリを入手(Google Play)", "copy": "リンクをコピー", "copied": "コピーしました", "steps": ["アプリがなければ、先にインストールします。", "そのあとこのページに戻って「Dear Crayon アプリで開く」を押します。", "アプリが開かないときは「リンクをコピー」→ アプリの うちの子 › 先生と連携 › リンクを貼り付け。"], "bad": "リンクが途中で切れています。先生のメッセージのリンクをそのまま押してください。", "ios": "iPhone アプリは準備中です。今は Android だけで使えます。", "note": "このリンクはお子さま専用です。ほかの人に送らないでください。"}};
  var PLAY = "https://play.google.com/store/apps/details?id=com.dearcrayon.app";
  var langs = (navigator.languages || [navigator.language || 'en']).map(function (l) { return String(l).slice(0, 2).toLowerCase(); });
  var lang = langs.filter(function (l) { return T[l]; })[0] || 'en';
  var t = T[lang];
  document.documentElement.lang = lang;
  var frag = location.hash.slice(1);
  var ok = /^1\.[A-Za-z0-9_-]{10,}\.[a-z0-9]{32}$/.test(frag);
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  function $(id) { return document.getElementById(id); }
  $('t').textContent = t.title;
  $('lead').textContent = t.lead;
  $('note').textContent = t.note;
  $('get').textContent = t.get;
  $('get').href = PLAY;
  $('open').textContent = t.open;
  $('copy').textContent = t.copy;
  t.steps.forEach(function (s) { var li = document.createElement('li'); li.textContent = s; $('steps').appendChild(li); });
  if (!ok) { $('bad').textContent = t.bad; $('bad').hidden = false; $('open').hidden = true; $('copy').hidden = true; }
  if (ios) { $('ios').textContent = t.ios; $('ios').hidden = false; }
  $('open').href = ok
    ? (/Android/i.test(navigator.userAgent)
        ? 'intent://join/' + frag + '#Intent;scheme=dearcrayon;package=com.dearcrayon.app;S.browser_fallback_url=' + encodeURIComponent(PLAY) + ';end'
        : 'dearcrayon://join/' + frag)
    : '#';
  $('copy').addEventListener('click', function () {
    var done = function () { $('copy').textContent = t.copied; };
    if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, function () { window.prompt('', location.href); });
    else window.prompt('', location.href);
  });
})();
</script>
</body>
</html>
