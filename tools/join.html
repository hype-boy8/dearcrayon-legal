<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fffdf7">
<title>선생님이 보낸 작품 받기 · Dear Crayon</title>
<meta name="description" content="선생님이 담은 아이의 작품을 Dear Crayon에서 간직해요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dear Crayon">
<meta property="og:title" content="선생님이 보낸 작품 받기 · Dear Crayon">
<meta property="og:description" content="선생님이 담은 아이의 작품을 Dear Crayon에서 간직해요.">
<meta property="og:image" content="__BASE__assets/og-brand-v74.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="__BASE__assets/og-brand-v74.png">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="stylesheet" href="../assets/site.css?v=75">
<script src="../assets/site.js?v=74" defer></script>
<style>
/* Existing brand, restrained motion, low density. Approved art and shared tokens. */
.join-page [hidden]{display:none!important}
.join-page .wrap{max-width:1000px}
.join-page .top{margin-bottom:24px}
.join-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);align-items:center;gap:48px;padding:24px 0 44px;margin:0}
.join-copy h1{font-size:36px;line-height:1.45;letter-spacing:-.035em;text-wrap:balance;margin:0}
.join-copy h1 span{display:block}
.join-copy .lead{font-size:18px;line-height:1.8;color:var(--muted);margin:20px 0 0;max-width:29em}
.join-art{position:relative;display:grid;place-items:center}
.join-art::before{content:'';position:absolute;width:95%;aspect-ratio:1;background:#f9edbf;opacity:.65;border-radius:50%}
.join-art img{position:relative;width:100%;height:auto;transform:rotate(-5deg)}
.join-actions{display:grid;gap:12px;margin-top:28px;max-width:420px}
.join-button{display:flex;align-items:center;justify-content:center;min-height:56px;padding:14px 20px;border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px;font-weight:700;line-height:1.6;text-decoration:none;text-align:center;cursor:pointer}
.join-button:hover{background:var(--soft)}
.join-button.primary{background:var(--brand-ink);border-color:var(--brand-ink);color:var(--bg)}
.join-button.primary:hover{background:#913323;border-color:#913323}
.join-button:focus-visible{outline:3px solid var(--brand);outline-offset:4px}
.join-store{margin:0;font-size:14px;line-height:1.65;color:var(--muted)}
.join-store a{display:inline-flex;align-items:center;min-height:44px;font-weight:700;gap:8px}
.join-status{font-size:14px;line-height:1.75;background:var(--brand-weak);border-radius:16px;padding:16px 18px;margin:20px 0 0}
.join-status p{margin:0}.join-status p+p{margin-top:8px}
.join-guide{max-width:660px;margin:0 auto;border-top:1px solid var(--line);padding-top:24px}
.join-guide .receive{margin:0;background:var(--soft)}
.join-guide .receive summary{font-size:18px;min-height:64px}
.join-guide ol{list-style:none;counter-reset:step;padding:0;margin:4px 0 20px;display:grid;gap:20px}
.join-guide li{counter-increment:step;display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;font-size:16px;line-height:1.75;margin:0;color:var(--muted)}
.join-guide li::before{content:counter(step);display:grid;place-items:center;width:28px;height:28px;border-radius:10px;background:var(--bg);color:var(--brand-ink);font-size:14px;font-weight:700}
.join-guide .join-button{width:100%}
.join-note{font-size:14px;line-height:1.7;text-align:center;color:var(--muted);margin:20px auto 0;max-width:36em}
.join-footer{border:0;margin:28px 0 0;padding:0;text-align:center;font-size:14px}
.join-footer a{display:inline-flex;align-items:center;min-height:44px;color:var(--muted)}
.manual-copy{margin:16px 0 0}.manual-copy label{display:block;font-size:14px;margin-bottom:8px}.manual-copy textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px;overflow-wrap:anywhere;resize:vertical}.manual-copy textarea:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
@media(max-width:767px){.join-hero{grid-template-columns:1fr;gap:16px;padding:0 0 28px;text-align:center}.join-art{grid-row:1;width:132px;margin:0 auto}.join-copy h1{font-size:28px;line-height:1.45}.join-copy .lead{font-size:16px;line-height:1.75;margin:16px auto 0;max-width:27em}.join-actions{margin:24px auto 0}.join-guide{padding-top:24px}.join-guide .receive summary{font-size:16px}.join-status{text-align:left}.join-note{font-size:14px}.join-footer{margin-top:20px}}
@media(max-width:359px){.join-copy h1{font-size:26px}.join-art{width:112px}.join-button{padding-inline:12px}.join-page .top{gap:12px}}
</style>
</head>
<body class="join-page">
<div class="wrap">
<header class="top">
<a class="brand" id="brand-home" href="../"><img src="../assets/logo.png" alt="Dear Crayon" width="176" height="58"></a>
<details class="language" id="language"><summary id="language-trigger" aria-label="언어 선택"><span id="language-name">한국어</span><i class="chevron" aria-hidden="true"></i></summary><nav class="language-menu" aria-label="언어 선택" id="languages">__LANGUAGES__</nav></details>
</header>
<main>
<section class="join-hero" aria-labelledby="t">
<div class="join-copy">
<h1 id="t"><span>선생님이 보낸 그림,</span><span>우리 아이의 기록으로.</span></h1>
<p class="lead" id="lead">처음 한 번만 연결해 두세요. 선생님이 찍은 아이의 작품을 앱에서 받아 간직할 수 있어요.</p>
<div id="bad" class="join-status" role="status" hidden></div>
<div id="ios" class="join-status" hidden></div>
<div class="join-actions">
<a id="open" class="join-button primary" hidden></a>
<div class="join-store"><span id="store-note"></span><br><a id="get" href="../">앱 설치 안내 <span aria-hidden="true">↗</span></a></div>
</div>
</div>
<div class="join-art"><img src="../assets/drawing.png" alt="" width="512" height="512" fetchpriority="high"></div>
</section>
<div class="join-guide" id="guide-wrap" hidden>
<details class="receive" id="guide"><summary><span id="guide-title">연결 방법이 궁금한가요?</span><i class="chevron" aria-hidden="true"></i></summary>
<div class="receive-body"><ol id="steps"></ol><button id="copy" class="join-button" type="button" aria-live="polite"></button>
<div class="manual-copy" id="manual-copy" hidden><label id="manual-label" for="manual-link"></label><textarea id="manual-link" readonly rows="3" spellcheck="false"></textarea></div>
</div></details>
<p class="join-note" id="note"></p>
</div>
<noscript><p>연결 링크를 열려면 JavaScript를 켜 주세요.<br>Enable JavaScript to open this invitation.</p></noscript>
</main>
<footer class="join-footer" id="join-footer"><a id="about" href="../">Dear Crayon 알아보기</a></footer>
</div>
<script>
(function () {
  'use strict';
  var T = __DATA__;
  var PLAY = __PLAY__;
  var AVAILABLE = __AVAILABLE__;
  var names = {ko:'한국어',en:'English',de:'Deutsch',fr:'Français',es:'Español',ja:'日本語'};
  var langs = (navigator.languages || [navigator.language || 'en']).map(function (l) { return String(l).slice(0, 2).toLowerCase(); });
  var requested = new URLSearchParams(location.search).get('lang');
  var lang = Object.prototype.hasOwnProperty.call(T, requested) ? requested : langs.filter(function (l) { return T[l]; })[0] || 'en';
  var isIos = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(navigator.userAgent);
  var frag, ok, t;
  function $(id) { return document.getElementById(id); }
  function home() { return '../' + (lang === 'ko' ? '' : lang + '/'); }
  function invitationUrl() { return location.origin + location.pathname + '?lang=' + lang + location.hash; }
  function render() {
    t = T[lang];
    frag = location.hash.slice(1);
    ok = /^1\.[A-Za-z0-9_-]{10,}\.[a-z0-9]{32}$/.test(frag);
    document.documentElement.lang = lang;
    document.title = t.title + ' · Dear Crayon';
    $('t').replaceChildren();
    t.hero.forEach(function (line) { var span = document.createElement('span'); span.textContent = line; $('t').appendChild(span); });
    $('lead').textContent = t.intro;
    $('note').textContent = t.note;
    $('language-name').textContent = names[lang];
    $('language-trigger').setAttribute('aria-label', t.language + ': ' + names[lang]);
    $('languages').setAttribute('aria-label', t.language);
    $('languages').querySelectorAll('a').forEach(function (link) {
      var choice = link.hreflang;
      link.href = '?lang=' + choice + location.hash;
      if (choice === lang) link.setAttribute('aria-current', 'true');
      else link.removeAttribute('aria-current');
    });
    $('store-note').textContent = AVAILABLE ? t.needApp : t.coming;
    $('get').textContent = AVAILABLE ? t.get : t.install;
    $('get').href = AVAILABLE ? PLAY : home();
    $('open').textContent = t.open;
    $('open').hidden = !ok || isIos;
    var fallback = AVAILABLE ? PLAY : new URL(home(), location.href).href;
    if (ok) $('open').href = isAndroid
      ? 'intent://join/' + frag + '#Intent;scheme=dearcrayon;package=com.dearcrayon.app;S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end'
      : 'dearcrayon://join/' + frag;
    else $('open').removeAttribute('href');
    $('copy').textContent = t.copy;
    $('guide-title').textContent = t.help;
    $('guide-wrap').hidden = !ok;
    $('steps').replaceChildren();
    t.steps.forEach(function (line) { var li = document.createElement('li'); var span = document.createElement('span'); span.textContent = line; li.appendChild(span); $('steps').appendChild(li); });
    $('bad').textContent = t.bad;
    $('bad').hidden = ok;
    $('ios').textContent = t.ios;
    $('ios').hidden = !isIos;
    $('manual-copy').hidden = true;
    $('manual-link').value = '';
    $('manual-label').textContent = t.manual;
    $('join-footer').hidden = !AVAILABLE;
    $('about').textContent = t.about;
    $('about').href = home();
    $('brand-home').href = home();
  }
  $('languages').addEventListener('click', function (event) {
    var link = event.target.closest('a[hreflang]');
    if (!link || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    lang = link.hreflang;
    var url = new URL(location.href);
    url.searchParams.set('lang', lang);
    history.replaceState(null, '', url);
    render();
    $('language').open = false;
    $('language-trigger').focus();
  });
  $('copy').addEventListener('click', function () {
    if (!ok) return;
    function done() { $('copy').textContent = T[lang].copied; }
    function manual() { $('manual-copy').hidden = false; $('manual-link').value = invitationUrl(); $('manual-link').focus(); $('manual-link').select(); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(invitationUrl()).then(done, manual);
    else manual();
  });
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
